<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>DEFENSE</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="game" class="game">
    <div class="snow"></div>
    <header class="hud">
      <div class="resource"><span class="resource-icon">◆</span><span id="resource">0</span></div>
      <div class="wave">WAVE <b id="wave">1</b></div>
      <div class="base-hp">BASE <b id="hp">100</b></div>
    </header>
    <main id="field" class="field">
      <div id="enemyLayer"></div>
      <div id="pickupLayer"></div>
      <div id="player"><div class="player-gun"></div></div>
      <div id="squad"></div>
      <div class="base"></div>
    </main>
    <div class="bottom-ui">
      <button id="addUnit" disabled>병력 추가 <span>100</span></button>
      <div class="hint">화면을 눌러 공격 방향을 지정하세요</div>
    </div>
    <div id="message" class="message"></div>
  </div>
  <script src="./game.js"></script>
</body>
</html>

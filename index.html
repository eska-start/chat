<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Speed Camera</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">TRAFFIC ENFORCEMENT</p><h1>Speed Camera</h1><p class="subtitle">과속 차량을 정확한 순간에 촬영하세요</p></div><div class="score-box"><span>SCORE</span><strong id="score">0</strong></div></header><section class="game-wrap"><canvas id="game" width="900" height="560"></canvas><div class="hud"><div><b>SPEED LIMIT</b><strong id="limit">80</strong><small> km/h</small></div><div id="status">CAMERA READY</div><div><b>BEST</b><strong id="best">0</strong></div></div><div class="camera-ui"><div class="speed-readout"><span>VEHICLE SPEED</span><strong id="speed">0</strong><small>km/h</small></div><div class="target-readout"><span>PLATE</span><strong id="plate">---</strong></div><button id="flashBtn">CAMERA</button></div><div class="overlay" id="overlay"><div class="card"><p class="eyebrow">SPEED CAMERA</p><h2 id="overlayTitle">READY?</h2><p id="overlayText">도로를 지나가는 차량의 속도를 확인하고<br>과속 차량이 단속선에 도착하는 순간 촬영하세요.</p><button id="startBtn">단속 시작</button></div></div></section><div class="controls"><p><b>촬영</b> SPACE &nbsp; <b>카메라</b> 화면 버튼 &nbsp; 정확한 타이밍으로 높은 점수</p><button class="small-btn" id="resetBtn">새 게임</button></div></main><script src="./game.js"></script></body></html>

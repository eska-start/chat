<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Thunder Volley</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">ARCADE VOLLEYBALL</p><h1>Thunder Volley</h1><p class="subtitle">전기 몬스터와 즐기는 1:1 미니 배구</p></div><div class="score-box"><span>SCORE</span><strong id="score">0 : 0</strong></div></header><section class="game-wrap"><canvas id="game" width="900" height="560"></canvas><div class="hud"><div><b>YOU</b><strong id="leftScore">0</strong></div><div id="serveText">READY</div><div><b>CPU</b><strong id="rightScore">0</strong></div></div><div class="overlay" id="overlay"><div class="card"><p class="eyebrow">THUNDER VOLLEY</p><h2 id="overlayTitle">READY?</h2><p id="overlayText">공을 들고 시작합니다.<br>SPACE로 서브 · Z 일반타격 · X 스파이크</p><button id="startBtn">게임 시작</button></div></div></section><div class="controls"><p><b>이동</b> A/D 또는 ←/→ &nbsp; <b>점프</b> W/↑ &nbsp; <b>일반타격</b> Z &nbsp; <b>스파이크</b> X &nbsp; <b>서브</b> SPACE</p><button class="small-btn" id="resetBtn">새 게임</button></div><div class="mobile-controls"><button data-key="left">◀</button><button data-key="jump">JUMP</button><button data-key="right">▶</button><button data-key="hit">HIT</button><button data-key="spike">SPIKE</button></div></main><script src="./game.js"></script></body></html>
